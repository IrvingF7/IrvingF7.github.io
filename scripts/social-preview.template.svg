<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="matrix" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1" fill="{{MATRIX_DOT}}" />
    </pattern>
    <clipPath id="portrait-clip">
      <rect x="848" y="72" width="292" height="430" rx="18" />
    </clipPath>
    <linearGradient id="portrait-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="62%" stop-color="{{SHELL}}" stop-opacity="0" />
      <stop offset="100%" stop-color="{{SHELL}}" stop-opacity="0.26" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="{{SHELL}}" />
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="{{PAPER}}" stroke="{{INK}}" stroke-opacity="0.24" />
  <rect x="25" y="25" width="1150" height="580" rx="23" fill="url(#matrix)" />

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="78" cy="78" r="28" fill="{{INK}}" />
    <text x="78" y="84" fill="{{PAPER}}" font-size="17" font-weight="700" text-anchor="middle">IF</text>
    <circle cx="96" cy="60" r="4" fill="{{ORANGE}}" />

    <text x="124" y="72" fill="{{INK}}" font-size="16" font-weight="700" letter-spacing="0.5">{{BRAND_NAME}}</text>
    <text x="124" y="96" fill="{{MUTED}}" font-family="monospace" font-size="12" letter-spacing="1.5">{{ROLE}}</text>

    <line x1="70" y1="132" x2="802" y2="132" stroke="{{INK}}" stroke-opacity="0.34" />
    <text x="70" y="164" fill="{{MUTED}}" font-family="monospace" font-size="13" letter-spacing="1.4">{{FIELD}}</text>

    <text x="64" y="278" fill="{{INK}}" font-size="112" font-weight="700" letter-spacing="-7">{{NAME_LINE_1}}</text>
    <text x="174" y="372" fill="{{INK}}" font-size="112" font-weight="700" letter-spacing="-7">{{NAME_LINE_2}}</text>

    <g transform="translate(632 208) scale(1.28)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 34C43 8 88 7 108 34" stroke="{{INK}}" stroke-opacity="0.42" stroke-dasharray="1 6" stroke-width="1.5" />
      <path d="M10 83h38M16 76h26M22 69h14M29 69 45 47 69 57 88 31M88 31l12-6m0 0 9-6m-9 6 7 9" stroke="{{INK}}" stroke-width="2" />
      <circle cx="29" cy="69" r="5.5" fill="{{PAPER}}" stroke="{{INK}}" stroke-width="2" />
      <circle cx="45" cy="47" r="5.5" fill="{{PAPER}}" stroke="{{INK}}" stroke-width="2" />
      <circle cx="69" cy="57" r="5.5" fill="{{ORANGE}}" stroke="{{INK}}" stroke-width="2" />
      <circle cx="88" cy="31" r="4.5" fill="{{PAPER}}" stroke="{{INK}}" stroke-width="2" />
      <path d="M91 49h17" stroke="{{BLUE}}" stroke-dasharray="2 4" stroke-width="2" />
      <rect x="108" y="45" width="5" height="8" rx="1" fill="{{BLUE}}" stroke="{{INK}}" stroke-width="1.5" />
    </g>

    <g>
      <circle cx="72" cy="406" r="3" fill="{{ORANGE}}" />
      <circle cx="84" cy="406" r="3" fill="{{ORANGE}}" />
      <circle cx="96" cy="406" r="3" fill="{{ORANGE}}" />
      <circle cx="116" cy="406" r="3" fill="{{BLUE}}" />
      <circle cx="128" cy="406" r="3" fill="{{BLUE}}" />
      <circle cx="140" cy="406" r="3" fill="{{BLUE}}" />
    </g>

    <rect x="70" y="438" width="592" height="52" rx="26" fill="{{INK}}" />
    <text x="94" y="471" fill="{{PAPER}}" font-family="monospace" font-size="15" font-weight="700" letter-spacing="0.6">{{TAGLINE}}</text>

    <line x1="70" y1="540" x2="802" y2="540" stroke="{{INK}}" stroke-opacity="0.22" />
    <text x="70" y="574" fill="{{INK_2}}" font-family="monospace" font-size="14" letter-spacing="1">{{URL}}</text>
    <text x="802" y="574" fill="{{MUTED}}" font-family="monospace" font-size="12" letter-spacing="1" text-anchor="end">{{FOOTER_LABEL}}</text>
  </g>

  <rect x="834" y="58" width="320" height="458" rx="24" fill="{{MEDIA_SURFACE}}" stroke="{{INK}}" stroke-opacity="0.28" />
  <image x="848" y="72" width="292" height="430" href="{{PHOTO_HREF}}" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-clip)" />
  <rect x="848" y="72" width="292" height="430" rx="18" fill="url(#portrait-shade)" />
  <rect x="848" y="72" width="292" height="430" rx="18" fill="none" stroke="{{INK}}" stroke-opacity="0.55" />
  <circle cx="1124" cy="486" r="5" fill="{{ORANGE}}" />
</svg>
